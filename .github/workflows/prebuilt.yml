# Epic's PREBUILT Linux Unreal Engine, unpacked on a hosted runner, and then
# actually started.
#
# WHY THIS CHANGES THE PROBLEM. Everything measured so far downloads engine
# SOURCE and its dependencies -- 86 GB at best, and still no editor, because a
# Linux UE from source has to be compiled and nobody has ever measured that
# compile. Epic publishes a prebuilt Linux binary release:
# Linux_Unreal_Engine_5.8.2.zip, 37.08 GB, dated 2026-08-25, from
# unrealengine.com/linux. If it unpacks and starts here, the compile question
# disappears entirely.
#
# THE URL IS A CREDENTIAL AND IT IS NOT IN THIS FILE. It is a presigned S3
# link that expires within the hour and, while live, serves Epic's engine
# binaries to anyone holding it. This repository is PUBLIC, and workflow files
# and dispatch inputs are both world-readable here -- a repository SECRET is
# the only one of the three that GitHub masks in logs. Hence
# secrets.TBS_ENGINE_ZIP_URL.
#
# ARITHMETIC BEFORE SPENDING HALF AN HOUR ON IT: the runner has ~116 GB free.
# The zip is 37 GB and Epic's own page asks for ~60 GB free to install, so the
# peak is roughly 97 GB with both present. It fits, but not by much, so the
# zip is DELETED the moment extraction succeeds and the free space is recorded
# on both sides of that.
#
# Every `run:` block is `bash -e`, which kills a step before a later line can
# record anything, so every stage is `set +e` with an explicit rc.
name: prebuilt

on:
  workflow_dispatch:
    inputs:
      boot:
        description: 'after unpacking, try to start the editor on this project'
        type: boolean
        default: true
      source:
        description: 'where the engine comes from'
        type: choice
        options: [image, zip]
        default: image
      build:
        description: 'compile the TehranBlindSpot module for Linux first'
        type: boolean
        default: true
      mirror:
        description: 'off | roundtrip | save -- keep the image off ghcr. roundtrip costs no pull'
        required: false
        default: 'off'
      render:
        description: 'ask whether this container can render, then render Valiasr offscreen'
        type: boolean
        default: true
      commit:
        description: 'push the report to the private repo'
        type: boolean
        default: true

permissions: {}

jobs:
  prebuilt:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Are both secrets present
        id: secret
        env:
          TOK: ${{ secrets.TBS_PRIVATE_TOKEN }}
          ZIP: ${{ secrets.TBS_ENGINE_ZIP_URL }}
          SRC: ${{ inputs.source }}
        run: |
          set +e
          OK=yes
          if [ -z "$TOK" ]; then
            echo "TBS_PRIVATE_TOKEN is NOT set."
            OK=no
          fi
          # The zip URL is only needed when the zip IS the source. Since
          # run 33046053174 measured ghcr.io serving
          # epicgames/unreal-engine:dev-slim-5.8.2 to a token that does not
          # expire, the default source is the image and this secret is
          # optional. Demanding it unconditionally would block the very run
          # that no longer needs it.
          if [ "${SRC}" = "zip" ] && [ -z "$ZIP" ]; then
            echo "source=zip was asked for but TBS_ENGINE_ZIP_URL is NOT set."
            echo "It is the presigned download URL for Epic's"
            echo "Linux_Unreal_Engine_5.8.2.zip -- a credential that expires,"
            echo "so it does not belong in a workflow file or a dispatch"
            echo "input on a public repository. Use source=image instead."
            OK=no
          fi
          echo "engine source : ${SRC}"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          [ "$OK" = "yes" ] && echo "both secrets present"

      - uses: actions/checkout@v4
        if: steps.secret.outputs.ok == 'yes'
        with:
          repository: Mohammadlali/Claud-Cloud-Project
          ref: ${{ vars.TBS_BRANCH || 'claude/gateway-auth-fix-nr7k0b' }}
          token: ${{ secrets.TBS_PRIVATE_TOKEN }}
          fetch-depth: 0
          path: work
          # WITHOUT THIS, Content/ ARRIVES AS 130-BYTE POINTERS. Every .umap
          # and .uasset is Git LFS, so `district_01_valiasr.umap` -- the level
          # rung 4 has to render -- is a text stub and load_level fails for a
          # reason that looks nothing like the real one. Measured 2026-08-27:
          # the whole LFS payload is 179 objects and 16.3 MB, the map itself
          # 117 KB, so this costs essentially nothing.
          lfs: true

      - name: Make room
        id: room
        if: steps.secret.outputs.ok == 'yes'
        run: |
          set +e
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup \
                      /usr/share/swift /opt/hostedtoolcache 2>/dev/null
          # TWO filesystems, and only one of them has ever been measured.
          # / was 116 GB free after this cleanup; /mnt was never looked at,
          # and run 33024091160 wrote the zip there anyway.
          FREE=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          FREE_MNT=$(df -BG --output=avail /mnt 2>/dev/null | tail -1 | tr -dc '0-9')
          echo "free=$FREE"              >> "$GITHUB_OUTPUT"
          echo "free_mnt=${FREE_MNT:-0}" >> "$GITHUB_OUTPUT"
          echo "free after cleanup : / ${FREE} GB, /mnt ${FREE_MNT:-unknown} GB"
          echo "--- df, both disks ---"
          df -h / /mnt 2>&1
          # /mnt itself is root-owned on a hosted runner, so a non-root
          # process cannot create a file directly in it. That is curl exit
          # 23 -- write error -- at zero seconds and zero bytes, which is
          # exactly what run 33024091160 reported. The zip now goes into a
          # directory this user owns, and the write test below PROVES the
          # directory is writable instead of assuming it did the job.
          sudo mkdir -p /mnt/dl
          sudo chown "$(id -u):$(id -g)" /mnt/dl
          mkdir -p /home/runner/ue
          : > /mnt/dl/.writetest
          W_DL=$?
          : > /home/runner/ue/.writetest
          W_UE=$?
          rm -f /mnt/dl/.writetest /home/runner/ue/.writetest
          echo "writable_dl=$W_DL" >> "$GITHUB_OUTPUT"
          echo "writable_ue=$W_UE" >> "$GITHUB_OUTPUT"
          echo "write test : /mnt/dl rc=$W_DL   /home/runner/ue rc=$W_UE"
          echo "--- ownership, for the record ---"
          ls -ld /mnt /mnt/dl /home/runner /home/runner/ue 2>&1

      - name: Pull the engine image from ghcr.io
        id: pull
        # `mirror: roundtrip` must cost NO pull -- it exists to settle the
        # store before anything bets 22.9 GB on it. Without this guard a
        # roundtrip run would pull the image anyway and prove nothing
        # about cheapness while spending the very quota at issue.
        if: ${{ steps.secret.outputs.ok == 'yes' && inputs.source == 'image' && inputs.mirror != 'roundtrip' }}
        env:
          TOK: ${{ secrets.TBS_PRIVATE_TOKEN }}
          IMG: ghcr.io/epicgames/unreal-engine:dev-slim-5.8.2
        run: |
          set +e
          # WHY THIS REPLACES THE ZIP. Run 33046053174 measured ghcr.io
          # answering 200 for epicgames/unreal-engine and listing 89 tags
          # including dev-slim-5.8.2, whose manifest is 22888 MB compressed
          # against the presigned zip's 37973 MB. A registry credential does
          # not expire in an hour, which is the whole reason the zip route
          # needed a hand-minted link before every single run.
          #
          # TBS_PRIVATE_TOKEN carries write:packages, so the same secret this
          # workflow already uses can pull it. No new secret is introduced.
          BEGAN=$(date +%s)
          echo "$TOK" | docker login ghcr.io -u Mohammadlali --password-stdin > /tmp/login.txt 2>&1
          if [ $? -ne 0 ]; then
            echo "rc=70" >> "$GITHUB_OUTPUT"
            echo "docker login to ghcr.io FAILED. What it said:"
            sed -e 's/[A-Za-z0-9_-]\{20,\}/<redacted>/g' /tmp/login.txt | head -5
            exit 0
          fi
          echo "logged in to ghcr.io."
          # THREE ATTEMPTS, BECAUSE GHCR RATE-LIMITS AND A SINGLE SHOT TURNS
          # THAT INTO A DEAD RUN. Run 33203227534 pulled this 22.9 GB image
          # for the fourth time in one afternoon and got
          #
          #   toomanyrequests: {"errors":[{"code":"TOOMANYREQUESTS",
          #                     "message":"retry-after: 238.028883ms"}]}
          #
          # after 49 s. Every step below is gated on this one, so the whole
          # run -- build, boot, the Vulkan dumps the run existed for --
          # was skipped over a limit whose own retry-after was a fifth of a
          # second. The wait here is far longer than that on purpose: the
          # header names the delay for ONE request, and what we need is for a
          # burst of them to age out.
          #
          # A RETRY IS ONLY HONEST FOR A NAMED TRANSIENT. This one retries
          # any non-zero rc but SAYS which attempt succeeded and prints every
          # failure, so a run that needed three goes cannot be read as a run
          # that needed one. It does not retry a login refusal -- that is
          # handled above and is a credential, not a queue.
          RC=1
          for TRY in 1 2 3; do
            docker pull "$IMG" > /tmp/pull.txt 2>&1
            RC=$?
            [ $RC -eq 0 ] && break
            echo "pull attempt $TRY failed (rc $RC). Its last lines:"
            tail -3 /tmp/pull.txt
            if [ $TRY -lt 3 ]; then
              WAIT=$(( TRY * 120 ))
              echo "waiting ${WAIT}s before attempt $(( TRY + 1 ))"
              sleep "$WAIT"
            fi
          done
          echo "pull_tries=$TRY" >> "$GITHUB_OUTPUT"
          SECS=$(( $(date +%s) - BEGAN ))
          echo "pull rc=$RC in ${SECS}s after $TRY attempt(s)"
          if [ $RC -ne 0 ]; then
            echo "rc=$RC" >> "$GITHUB_OUTPUT"
            echo "the pull failed. Its own last lines:"
            tail -5 /tmp/pull.txt
            exit 0
          fi
          docker image inspect "$IMG" --format 'image size on disk : {{.Size}} bytes' 2>/dev/null
          # DO NOT GUESS WHERE THE ENGINE LIVES INSIDE THE IMAGE. Ask it.
          # A path typed from memory that happens to be wrong looks exactly
          # like an image with no editor in it.
          CMD=$(docker run --rm --entrypoint sh "$IMG" -c 'find / -maxdepth 8 -type f -name UnrealEditor-Cmd 2>/dev/null | head -1')
          if [ -z "$CMD" ]; then
            echo "rc=71" >> "$GITHUB_OUTPUT"
            echo "NO UnrealEditor-Cmd ANYWHERE IN THE IMAGE."
            echo "This is the real answer to whether dev-slim carries an"
            echo "editor, and it is no. Re-run with the dev-5.8.2 tag."
            echo "--- top-level directories in the image, for the record ---"
            docker run --rm --entrypoint sh "$IMG" -c 'ls -1 /' 2>/dev/null | head -20
            exit 0
          fi
          echo "editor inside the image : $CMD"
          ROOT=$(dirname "$(dirname "$(dirname "$(dirname "$CMD")")")")
          echo "engine root inside      : $ROOT"
          # NOTHING IS COPIED OUT, AND THAT IS THE POINT.
          # `docker cp` of the engine would put a SECOND full tree on the
          # same disk the extracted image already occupies -- both alive at
          # once, on the one 116 GB pool run 33041967920 proved /mnt shares
          # with /. The zip route already came within 6 GB of the wall doing
          # exactly that with the zip and its unpacked tree. Instead the
          # workspace is bind-mounted INTO the container at the same absolute
          # path it has outside, so every later step runs against one copy of
          # the engine and writes its output straight back onto the host.
          #
          # TWO RUNS DECIDED HOW THIS LINE IS WRITTEN, in opposite directions.
          #
          # 33047625082 ran as the image's own user and the editor died with
          # "Failed to create Intermediate directory
          # '/home/runner/work/Runner/Runner/work/Intermediate/'" -- the right
          # absolute path, so the mount was fine; that user cannot WRITE into
          # a workspace owned by the host's runner user. Reading it could,
          # which is why the rc 75 mount test passed and hid it.
          #
          # 33049314055 then ran as --user root. The module COMPILED, rc 0 in
          # 59 s -- and the editor refused to start, in one line of its own:
          #     Refusing to run with the root privileges.
          # That is Unreal's own check, not the runner's. So root buys the
          # build and loses the boot, and there is no version of --user root
          # that ever runs this editor.
          #
          # WHAT IS LEFT IS THE ONLY USER THAT OWNS BOTH THINGS. The build
          # writes into the ENGINE tree (33049314055's own log: "Output
          # binary: /home/ue4/UnrealEngine/Engine/Binaries/Linux/UnrealEditor")
          # and into the WORKSPACE. The image's user already owns the engine
          # tree. So the workspace is handed to that user on the host, with
          # sudo, and the container runs as its own default user: not root, and
          # able to write both. Handed back after the run by a later step.
          #
          # ASK THE IMAGE FOR THAT UID. /home/ue4 is a path in a log, not a
          # measurement, and a uid typed from memory that happens to be wrong
          # looks exactly like a permission bug.
          UEUID=$(docker run --rm --entrypoint id "$IMG" -u 2>/dev/null | tr -d '\r')
          UEGID=$(docker run --rm --entrypoint id "$IMG" -g 2>/dev/null | tr -d '\r')
          echo "image default user : uid=${UEUID:-<unread>} gid=${UEGID:-<unread>}"
          echo "ueuid=${UEUID}" >> "$GITHUB_OUTPUT"
          if [ -z "$UEUID" ] || [ -z "$UEGID" ]; then
            echo "rc=76" >> "$GITHUB_OUTPUT"
            echo "COULD NOT READ THE IMAGE'S DEFAULT UID. That is a failure to"
            echo "measure, not a uid of 0, and nothing below it would mean"
            echo "anything. Nothing was chowned."
            exit 0
          fi
          if [ "$UEUID" = "0" ]; then
            echo "rc=77" >> "$GITHUB_OUTPUT"
            echo "THE IMAGE'S DEFAULT USER IS ROOT. Unreal refuses to start as"
            echo "root (run 33049314055 said so itself), so this route needs a"
            echo "non-root user in the image and there is not one. Stopping"
            echo "here rather than spending a build on a boot that cannot pass."
            exit 0
          fi
          sudo chown -R "${UEUID}:${UEGID}" "$GITHUB_WORKSPACE" > /tmp/chown.txt 2>&1
          CH=$?
          echo "chown workspace to ${UEUID}:${UEGID} rc=$CH"
          if [ $CH -ne 0 ]; then
            echo "rc=78" >> "$GITHUB_OUTPUT"
            echo "COULD NOT HAND THE WORKSPACE TO THE IMAGE'S USER:"
            tail -3 /tmp/chown.txt
            exit 0
          fi
          # No --user: the image's own user, which now owns both trees.
          # --shm-size BECAUSE UBA ASKED FOR IT BY NAME. Run 33066212937's
          # build printed, before it hung for an hour and died on the 3600 s
          # timeout with rc 124:
          #
          #   UbaStorageServer - FileMapping backing: disk (/dev/shm 64MB <
          #   floor 1024MB; memfd: pidfd_getfd errno=1) - this works but is
          #   slower. ... alternatively raise --shm-size to use /dev/shm.
          #   Using Unreal Build Accelerator local executor to run 8 action(s)
          #   context canceled
          #
          # 64MB is docker's default and UBA states a 1024MB floor, so 2g.
          # WHAT THIS DOES NOT ESTABLISH: run 33050798591 built the same
          # module in 43.72 s on the same image with the same 64MB default,
          # so a small shm is NOT proven to be the cause -- whether that run
          # printed this warning is NOT MEASURED, because the step only ever
          # tailed 40 lines of the build log and the warning is near its top.
          # A single green build after this change therefore does not prove
          # the change fixed anything; a hang that recurs WITH 2g does prove
          # the shm was not it.
          docker run -d --name tbsue \
            --shm-size=2g \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            -w "$GITHUB_WORKSPACE" \
            --entrypoint sleep "$IMG" infinity > /tmp/run.txt 2>&1
          if [ $? -ne 0 ]; then
            echo "rc=73" >> "$GITHUB_OUTPUT"
            echo "the container would not start:"
            tail -5 /tmp/run.txt
            exit 0
          fi
          # Read it back: a container that exited immediately and one that is
          # running are the same `docker run` exit code.
          ST=$(docker inspect -f '{{.State.Status}}' tbsue 2>/dev/null)
          echo "container status : ${ST:-<none>}"
          if [ "$ST" != "running" ]; then
            echo "rc=74" >> "$GITHUB_OUTPUT"
            echo "the container is not running. Its last output:"
            docker logs tbsue 2>&1 | tail -5
            exit 0
          fi
          # Prove the mount actually arrived, rather than assuming -v worked.
          docker exec tbsue ls -la "$GITHUB_WORKSPACE/work/TehranBlindSpot.uproject" > /tmp/mnt.txt 2>&1
          if [ $? -ne 0 ]; then
            echo "rc=75" >> "$GITHUB_OUTPUT"
            echo "the workspace is NOT visible inside the container:"
            tail -3 /tmp/mnt.txt
            exit 0
          fi
          echo "the project file is visible inside the container."
          # SEEING A FILE AND BEING ABLE TO WRITE BESIDE IT ARE DIFFERENT
          # QUESTIONS, and run 33047625082 was decided by the second one
          # while this step only ever asked the first. A build that cannot
          # write and a build that fails to compile produce different rcs
          # and the same shrug, so ask now, in one line, and put the answer
          # in the report.
          # Read it back from the RUNNING container rather than trusting the
          # image inspection above: these are two different questions and
          # 33049314055 is what happens when the answer is 0.
          RUNUID=$(docker exec tbsue id -u 2>&1 | head -1)
          echo "uid inside container : $RUNUID"
          echo "runuid=$RUNUID" >> "$GITHUB_OUTPUT"
          docker exec tbsue sh -c "touch '$GITHUB_WORKSPACE/work/.tbs_write' && rm -f '$GITHUB_WORKSPACE/work/.tbs_write'" > /tmp/wr.txt 2>&1
          if [ $? -eq 0 ]; then
            echo "wr=yes" >> "$GITHUB_OUTPUT"
            echo "write test into the bind mount : rc 0"
          else
            echo "wr=no" >> "$GITHUB_OUTPUT"
            echo "CANNOT WRITE INTO THE BIND MOUNT. This is not a compile"
            echo "error and not a missing engine; every later rc is downstream"
            echo "of it. What it said:"
            tail -3 /tmp/wr.txt
          fi
          FREE=$(df -BG / | awk 'NR==2{gsub("G","",$4); print $4}')
          DMB=$(docker system df --format '{{.Type}} {{.Size}}' 2>/dev/null | tr '\n' ' ')
          echo "docker on disk : ${DMB:-<not reported>}"
          echo "free on /      : ${FREE} GB"
          echo "rc=0"            >> "$GITHUB_OUTPUT"
          echo "secs=$SECS"      >> "$GITHUB_OUTPUT"
          echo "editor=$CMD"     >> "$GITHUB_OUTPUT"
          echo "engine=$ROOT"    >> "$GITHUB_OUTPUT"
          echo "exec=docker exec tbsue" >> "$GITHUB_OUTPUT"
          echo "free=${FREE}"    >> "$GITHUB_OUTPUT"
          echo "dockerdf=${DMB}" >> "$GITHUB_OUTPUT"

      - name: Download the prebuilt engine
        id: dl
        if: ${{ steps.secret.outputs.ok == 'yes' && inputs.source == 'zip' }}
        env:
          ZIP: ${{ secrets.TBS_ENGINE_ZIP_URL }}
        run: |
          set +e
          BEGAN=$(date +%s)
          # --fail so an expired signature is an error rather than a saved
          # XML error page that unzip later calls corrupt. -sS keeps the
          # progress meter out of a public log without hiding errors.
          # The target is /mnt/dl/ue.zip, a directory this user owns.
          # /mnt/ue.zip -- directly in root-owned /mnt -- is what returned
          # curl 23 before a single byte moved.
          curl -L --fail -sS --max-time 7200 \
               -o /mnt/dl/ue.zip "$ZIP" 2>/tmp/curl.err
          RC=$?
          SECS=$(( $(date +%s) - BEGAN ))
          MB=$(du -sm /mnt/dl/ue.zip 2>/dev/null | cut -f1)
          # An exit code alone cannot separate "the path was not writable"
          # from "the signature expired", and curl's own sentence can. It
          # can also contain the presigned URL, which is a credential, so it
          # goes through the scrubber before it reaches this world-readable
          # log or the committed report.
          MSG=$(python3 "$GITHUB_WORKSPACE/work/Tools/scrub_secret.py" \
                  --env ZIP --in /tmp/curl.err --max 400 2>/dev/null)
          echo "rc=$RC"       >> "$GITHUB_OUTPUT"
          echo "secs=$SECS"   >> "$GITHUB_OUTPUT"
          echo "mb=${MB:-0}"  >> "$GITHUB_OUTPUT"
          {
            echo "msg<<TBS_EOF"
            echo "${MSG:-<the scrubber produced nothing>}"
            echo "TBS_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "download rc=$RC in ${SECS}s, ${MB:-0}MB"
          echo "curl said : ${MSG:-<nothing>}"
          if [ "$RC" -ne 0 ]; then
            echo "rc 23 is a WRITE error: the output path, not the link."
            echo "rc 22 with a 403 is an EXPIRED presigned signature, and"
            echo "the fix for that one is a fresh URL in the secret."
            echo "They are different answers. The line above says which."
          fi

      - name: Unzip it, then delete the zip
        id: unzip
        if: ${{ steps.secret.outputs.ok == 'yes' && steps.dl.outputs.rc == '0' && inputs.source == 'zip' }}
        run: |
          set +e
          BEGAN=$(date +%s)
          # The zip is on /mnt and the tree lands on /, so 37 GB of archive
          # and whatever it expands to are not asked to share one disk.
          unzip -q /mnt/dl/ue.zip -d /home/runner/ue
          RC=$?
          SECS=$(( $(date +%s) - BEGAN ))
          echo "unzip rc=$RC in ${SECS}s"
          FREE_BEFORE_RM=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          rm -f /mnt/dl/ue.zip
          FREE_AFTER_RM=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          FREE_MNT_AFTER=$(df -BG --output=avail /mnt 2>/dev/null | tail -1 | tr -dc '0-9')
          echo "mntfree=${FREE_MNT_AFTER:-0}" >> "$GITHUB_OUTPUT"
          MB=$(du -sm /home/runner/ue 2>/dev/null | cut -f1)
          echo "rc=$RC"           >> "$GITHUB_OUTPUT"
          echo "secs=$SECS"       >> "$GITHUB_OUTPUT"
          echo "mb=${MB:-0}"      >> "$GITHUB_OUTPUT"
          echo "tight=$FREE_BEFORE_RM" >> "$GITHUB_OUTPUT"
          echo "free=$FREE_AFTER_RM"   >> "$GITHUB_OUTPUT"
          echo "extracted ${MB}MB; free was ${FREE_BEFORE_RM}G with the zip"
          echo "still there, ${FREE_AFTER_RM}G after deleting it"
          echo "--- what the archive actually contains at the top ---"
          ls -1 /home/runner/ue | head -20

      - name: Find the editor
        id: find
        if: ${{ steps.secret.outputs.ok == 'yes' && steps.unzip.outputs.rc == '0' && inputs.source == 'zip' }}
        run: |
          set +e
          # Do not assume the zip has no wrapping directory -- look for the
          # binary rather than guessing the layout.
          CMD=$(find /home/runner/ue -maxdepth 6 -type f -name 'UnrealEditor-Cmd' \
                  2>/dev/null | head -1)
          echo "editor=$CMD" >> "$GITHUB_OUTPUT"
          if [ -z "$CMD" ]; then
            echo "NO UnrealEditor-Cmd ANYWHERE in the extracted tree."
            echo "found=no" >> "$GITHUB_OUTPUT"
            echo "--- directories two levels down, for the record ---"
            find /home/runner/ue -maxdepth 2 -type d | head -30
            exit 0
          fi
          echo "found=yes" >> "$GITHUB_OUTPUT"
          echo "editor : $CMD"
          ls -la "$CMD"
          chmod +x "$CMD" 2>/dev/null
          ENGDIR=$(dirname "$(dirname "$(dirname "$(dirname "$CMD")")")")
          echo "engine=$ENGDIR" >> "$GITHUB_OUTPUT"
          echo "engine root : $ENGDIR"

      - name: Build the TehranBlindSpot module for Linux
        id: build
        if: ${{ steps.secret.outputs.ok == 'yes' && (steps.find.outputs.found == 'yes' || steps.pull.outputs.rc == '0') && inputs.build }}
        env:
          ENG:  ${{ steps.find.outputs.engine || steps.pull.outputs.engine }}
          PFX:  ${{ steps.pull.outputs.exec }}
        run: |
          set +e
          # WHY THIS STEP EXISTS. Run 33041967920 got the editor to boot and
          # it exited 1 saying, in its own words: "The game module
          # 'TehranBlindSpot' could not be found. Please ensure that this
          # module exists and that it is compiled." The module has only ever
          # been compiled on the owner's Windows laptop and binaries are not
          # in git, so on Linux there is nothing to load. This compiles it.
          #
          # It is OUR module against an ALREADY-BUILT engine -- minutes, not
          # the hours an engine compile would cost. Nothing here builds the
          # engine.
          PROJ="$GITHUB_WORKSPACE/work/TehranBlindSpot.uproject"
          BUILD="$ENG/Engine/Build/BatchFiles/Linux/Build.sh"
          echo "engine root : $ENG"
          echo "project     : $PROJ"
          # Prove each input exists BEFORE spending the build, because "the
          # script was not there" and "the compile failed" are different
          # answers and a bare non-zero rc cannot tell them apart.
          # $PFX is empty on the zip route and "docker exec tbsue" on the
          # image route, so one line of shell serves both. Without it these
          # tests would ask the HOST about a path that only exists inside the
          # container and report rc 90/91 -- a missing file -- for an engine
          # that is sitting right there.
          if ! $PFX test -f "$PROJ"; then
            echo "rc=90" >> "$GITHUB_OUTPUT"
            echo "THE PROJECT FILE IS NOT THERE. Nothing was compiled."
            ls -la "$GITHUB_WORKSPACE/work" | head -20
            exit 0
          fi
          if ! $PFX test -f "$BUILD"; then
            echo "rc=91" >> "$GITHUB_OUTPUT"
            echo "NO Build.sh AT $BUILD -- this engine tree has no build tool."
            echo "--- what IS in BatchFiles, for the record ---"
            ls -1 "$ENG/Engine/Build/BatchFiles" 2>/dev/null | head -20
            ls -1 "$ENG/Engine/Build/BatchFiles/Linux" 2>/dev/null | head -20
            exit 0
          fi
          $PFX chmod +x "$BUILD" 2>/dev/null
          BEGAN=$(date +%s)
          # TehranBlindSpotEditor, not TehranBlindSpot: the Editor target is
          # the one UnrealEditor-Cmd loads, and it is what every probe needs.
          # -NoUba: UNREAL BUILD ACCELERATOR IS OFF, and the shm hypothesis
          # is DEAD. Five builds now, and --shm-size did not separate them:
          #
          #   64MB   /dev/shm fallback   43.72 s  ok    33050798591
          #   64MB   /dev/shm fallback   3600 s   HUNG  33066212937
          #   2048MB /dev/shm            61 s     ok    33090067823
          #   2048MB /dev/shm            61 s     ok    33093349034
          #   2048MB /dev/shm            3600 s   HUNG  33145205106
          #
          # Both sizes both succeeded and hung, so the shm was never the
          # cause -- exactly the falsification promised when 2g was added.
          #
          # WHAT THE EVIDENCE DOES POINT AT: both hangs stop dead immediately
          # after UBA starts. 33145205106's build log ends at "UbaServer -
          # Listening on 0.0.0.0:1345" / "run 8 action(s)" and then an hour
          # of nothing; 33066212937 added "context canceled" there and did
          # the same. UBA is the last subsystem alive in both.
          #
          # AND IT BUYS NOTHING HERE. It is a distributed build accelerator
          # being asked to coordinate EIGHT actions across TWO cores. Turning
          # it off removes a whole subsystem from the critical path whether
          # or not it is the culprit, which is why this is justified on its
          # own merits and not only as a fix.
          #
          # A GREEN BUILD AFTER THIS PROVES NOTHING ON ITS OWN, for the same
          # reason 2g proved nothing: two of five runs hung, so three greens
          # in a row is the least that would even be suggestive.
          timeout 3600 $PFX "$BUILD" TehranBlindSpotEditor Linux Development \
            -project="$PROJ" -waitmutex -NoUba > /tmp/build.log 2>&1
          RC=$?
          SECS=$(( $(date +%s) - BEGAN ))
          echo "rc=$RC"     >> "$GITHUB_OUTPUT"
          echo "secs=$SECS" >> "$GITHUB_OUTPUT"
          echo "build rc=$RC in ${SECS}s"
          # Read the RESULT back rather than trusting the exit code: a build
          # that silently produced nothing and one that worked have the same
          # rc often enough to be worth two seconds here.
          SO=$(find "$GITHUB_WORKSPACE/work/Binaries/Linux" -name '*TehranBlindSpot*' \
                 -type f 2>/dev/null | head -5)
          if [ -n "$SO" ]; then
            echo "so=yes" >> "$GITHUB_OUTPUT"
            echo "--- binaries produced ---"
            echo "$SO" | while read -r f; do ls -la "$f"; done
          else
            echo "so=no" >> "$GITHUB_OUTPUT"
            echo "NO TehranBlindSpot BINARY under work/Binaries/Linux."
          fi
          echo "--- last 40 lines of the build log ---"
          tail -40 /tmp/build.log 2>/dev/null

      - name: Start it on this project
        id: boot
        if: ${{ steps.secret.outputs.ok == 'yes' && (steps.find.outputs.found == 'yes' || steps.pull.outputs.rc == '0') && inputs.boot }}
        env:
          CMD:  ${{ steps.find.outputs.editor || steps.pull.outputs.editor }}
          PFX:  ${{ steps.pull.outputs.exec }}
        run: |
          set +e
          PROJ="$GITHUB_WORKSPACE/work/TehranBlindSpot.uproject"
          # THE LOG GOES UNDER $GITHUB_WORKSPACE because that is the ONLY path
          # bind-mounted into the container. Run 33050798591 wrote it to the
          # CONTAINER's /tmp and this workflow tailed the HOST's /tmp, so the
          # report printed "(none)" where the engine's own words belong. One
          # level above work/ keeps it out of the git checkout it sits beside.
          LOG="$GITHUB_WORKSPACE/boot.log"
          rm -f "$LOG" /tmp/boot.stdout /tmp/boot.digests
          $PFX ls -la "$PROJ"
          BEGAN=$(date +%s)
          # -NullRHI because there is no GPU here; this asks only whether the
          # editor STARTS and runs the project's own data-only probe, not
          # whether anything renders. Those are different questions and this
          # step answers the first one only.
          timeout 1800 $PFX "$CMD" "$PROJ" \
            -ExecutePythonScript="$GITHUB_WORKSPACE/work/Tools/probe_boot.py" \
            -unattended -nopause -nosplash -NullRHI -stdout \
            -abslog="$LOG" > /tmp/boot.stdout 2>&1
          RC=$?
          SECS=$(( $(date +%s) - BEGAN ))
          echo "rc=$RC"     >> "$GITHUB_OUTPUT"
          echo "secs=$SECS" >> "$GITHUB_OUTPUT"
          echo "boot rc=$RC in ${SECS}s"
          # COUNT WHAT distill.py PARSES, NOT SOMETHING STRICTER. unreal.log()
          # puts a timestamp and a log category in front of every line, so a
          # digest NEVER starts a line in an engine log. Run 33050798591
          # counted '^##TBS##' and reported 0 -- a number no emitting probe
          # could have moved, recorded as though it were a measurement.
          # Tools/probe_boot_digest_contract.py fails on the old pattern.
          : > /tmp/boot.digests
          for F in "$LOG" /tmp/boot.stdout; do
            if [ -f "$F" ]; then
              grep -hE '##TBS##[[:space:]]*\{' "$F" >> /tmp/boot.digests 2>/dev/null
            fi
          done
          # Strip the engine prefix so each digest STARTS its own line, which
          # is what check_digest_provenance requires of anything a report
          # quotes. The same line appears in both streams, hence sort -u.
          sed -i 's/^.*\(##TBS##\)/\1/' /tmp/boot.digests
          sort -u /tmp/boot.digests -o /tmp/boot.digests
          TBS=$(wc -l < /tmp/boot.digests | tr -d " ")
          # A FILE THAT IS NOT THERE AND A FILE WITH NO DIGESTS IN IT ARE
          # DIFFERENT ANSWERS. Zero on its own cannot tell them apart.
          if [ -f "$LOG" ]; then LOGSEEN=yes; else LOGSEEN=no; fi
          if [ -f /tmp/boot.stdout ]; then OUTSEEN=yes; else OUTSEEN=no; fi
          echo "tbs=$TBS"         >> "$GITHUB_OUTPUT"
          echo "logseen=$LOGSEEN" >> "$GITHUB_OUTPUT"
          echo "outseen=$OUTSEEN" >> "$GITHUB_OUTPUT"
          echo "##TBS## lines produced : $TBS"
          echo "editor log file present : $LOGSEEN ; stdout captured : $OUTSEEN"
          echo "--- the digest lines themselves ---"
          cat /tmp/boot.digests
          echo "--- last 60 lines the editor printed ---"
          tail -60 /tmp/boot.stdout 2>/dev/null
          echo "--- last 40 lines of its own log ---"
          tail -40 "$LOG" 2>/dev/null

      - name: Can this container render at all
        id: vk
        if: ${{ steps.secret.outputs.ok == 'yes' && steps.pull.outputs.rc == '0' && inputs.render }}
        env:
          PFX: ${{ steps.pull.outputs.exec }}
        run: |
          set +e
          # THE CHEAP DECISIVE QUESTION, ASKED BEFORE ANYTHING TRIES TO RENDER.
          # UE5 on Linux renders through Vulkan. There is no GPU on this
          # machine, so the target here is LAVAPIPE -- Mesa's SOFTWARE Vulkan
          # driver. That is a legitimate goal for this project: the scenes are
          # axis-aligned boxes with FULLY BAKED lighting, no Nanite, no Lumen.
          #
          # READ THIS BEFORE BELIEVING A PASS. A software device enumerating
          # is NOT a GPU rendering, and this project already has a scar file
          # for exactly that confusion -- Reports/cloud_host/
          # kaggle_vulkan_2026-08-26.CORRECTION.md exists because a digest
          # reported "supplied" when only llvmpipe was present. So this step
          # reports the DEVICE TYPE and never collapses it into a yes.
          # INSTALL THE SOFTWARE DRIVER FIRST. Run 33097623293 measured rc 81
          # on this image: a Vulkan LOADER is present and there is NO ICD in
          # /usr/share/vulkan/icd.d at all. A loader is not a driver, it finds
          # one, so nothing could render -- not for want of a GPU but for want
          # of a package. mesa-vulkan-drivers provides lavapipe, the SOFTWARE
          # Vulkan driver, and vulkan-tools provides vulkaninfo.
          #
          # -u 0 FOR THE INSTALL ONLY. apt needs root; Unreal refuses to run
          # as root and said so in run 33049314055. Those are different
          # commands and only this one gets root.
          $PFX true 2>/dev/null && docker exec -u 0 tbsue sh -c \
            'apt-get update -qq && apt-get install -y -qq mesa-vulkan-drivers vulkan-tools' \
            > /tmp/vkinstall.txt 2>&1
          echo "driver install rc=$? (see the tail below if it is non-zero)"
          tail -3 /tmp/vkinstall.txt 2>/dev/null
          LOADER=$($PFX sh -c 'ls /usr/lib/x86_64-linux-gnu/libvulkan.so.1 2>/dev/null | head -1')
          echo "vulkan loader : ${LOADER:-<none>}"
          if [ -z "$LOADER" ]; then
            echo "rc=80" >> "$GITHUB_OUTPUT"
            echo "no Vulkan loader in the image. That is a MISSING LIBRARY,"
            echo "not a machine that cannot render: libvulkan1 and mesa's"
            echo "lavapipe are apt packages. rc 80."
            exit 0
          fi
          ICDS=$($PFX sh -c 'ls -1 /usr/share/vulkan/icd.d/ 2>/dev/null')
          echo "icd files     : ${ICDS:-<none>}"
          if [ -z "$ICDS" ]; then
            echo "rc=81" >> "$GITHUB_OUTPUT"
            echo "a loader with NO ICD, AFTER the install step above ran."
            echo "The loader is not a driver; it finds one. Read the install"
            echo "rc and its tail before concluding anything about the image:"
            echo "an apt failure and an image that cannot host lavapipe are"
            echo "different answers. rc 81."
            exit 0
          fi
          $PFX sh -c 'command -v vulkaninfo >/dev/null && vulkaninfo --summary' \
            > /tmp/vk.txt 2>&1
          VKRC=$?
          echo "--- vulkaninfo --summary ---"
          head -40 /tmp/vk.txt
          # deviceType tells software from hardware and nothing else does.
          CPU_DEV=$(grep -c 'PHYSICAL_DEVICE_TYPE_CPU' /tmp/vk.txt 2>/dev/null)
          GPU_DEV=$(grep -cE 'PHYSICAL_DEVICE_TYPE_(DISCRETE|INTEGRATED)_GPU' /tmp/vk.txt 2>/dev/null)
          echo "cpu devices=$CPU_DEV  gpu devices=$GPU_DEV  vulkaninfo rc=$VKRC"
          # THE PROFILE AND THE DEVICE, SIDE BY SIDE, AS COMMITTED FILES.
          # Run 33158541672 named the mechanism and not the reason:
          #   LogVulkanRHI: Starting Vulkan Profile check for VP_UE_Vulkan_SM5:
          #   LogVulkanRHI: Warning: None of the 1 devices meet all the criteria!
          # A Vulkan PROFILE is a requirement list shipped in the engine tree,
          # so the failing clause is readable without another guess: dump what
          # Epic requires and what lavapipe actually offers, and diff them off
          # the runner. Neither goes in the report body -- both are large --
          # so they are committed as their own files.
          #
          # BOTH FILES ARE WRITTEN UNCONDITIONALLY, HEADER FIRST. Before this,
          # an empty result wrote no file at all and the commit step skipped
          # any file that was not `-s`, so a missing dump meant EITHER that
          # this code never ran on the runner OR that it ran and found
          # nothing. Those are different answers and the absence collapsed
          # them into one -- which is the failure this project makes more than
          # any other. The header names the search, so a zero is a RECORDED
          # zero and a missing file means the step did not run.
          # $RUNNER_TEMP, NOT THE WORKSPACE. Run 33200211918 wrote three
          # `Permission denied` lines here and produced no dump at all. The
          # cause is two steps up: `sudo chown -R ${UEUID}:${UEGID}
          # "$GITHUB_WORKSPACE"` hands the whole workspace to the IMAGE'S user
          # so Unreal will start (it refuses to run as root), and the chown
          # BACK does not happen until the report step, which is why the
          # report writes into the same directory perfectly well and this step
          # cannot. $RUNNER_TEMP belongs to the runner user the whole time.
          # The report step copies these in after it chowns back.
          VPF="$RUNNER_TEMP/vp_ue_vulkan_sm5.txt"
          VKF="$RUNNER_TEMP/lavapipe_vulkaninfo.txt"
          # NO EXTENSION FILTER. Run 33160904128 searched --include=*.json and
          # answered "<not found>": VP_UE_Vulkan_SM5 is NOT a json in the
          # tree. Vulkan profiles are commonly GENERATED INTO A C++ HEADER,
          # so the search takes any file type and reports every hit, because
          # where it lives is itself the finding.
          $PFX sh -c 'grep -rl "VP_UE_Vulkan_SM5" /home/ue4/UnrealEngine/Engine 2>/dev/null | head -20' \
            > /tmp/profhits.txt 2>/dev/null
          HITS=$(grep -c . /tmp/profhits.txt 2>/dev/null)
          echo "--- files naming VP_UE_Vulkan_SM5 (${HITS:-0}) ---"
          cat /tmp/profhits.txt 2>/dev/null
          {
            echo "search  : grep -rl VP_UE_Vulkan_SM5 /home/ue4/UnrealEngine/Engine"
            echo "run     : ${GITHUB_RUN_ID}"
            echo "hits    : ${HITS:-0}"
            echo "--- every file that named it ---"
            cat /tmp/profhits.txt 2>/dev/null
            echo "--- contents of the first hit ---"
          } > "$VPF"
          # PREFER A SOURCE FILE. The 14 hits from run 33200211918 were 13
          # COMPILED BINARIES -- Module.VulkanRHI.4.cpp.o, UnrealGame,
          # libUnrealEditor-VulkanRHI.so -- and one header:
          #   Engine/Source/ThirdParty/Vulkan/profiles/include/vulkan_profiles_ue.h
          # `head -1` would have dumped an object file as "the profile". A
          # binary that contains the string is not the definition of it.
          PROF=$(grep -E '\.(h|hpp|json|cpp)$' /tmp/profhits.txt | head -1)
          [ -z "$PROF" ] && PROF=$(head -1 /tmp/profhits.txt 2>/dev/null)
          echo "profile source chosen : ${PROF:-<none>}"
          if [ -n "$PROF" ]; then
            $PFX cat "$PROF" >> "$VPF" 2>/dev/null
          else
            echo "(no file in the engine tree names VP_UE_Vulkan_SM5. This is" >> "$VPF"
            echo " a MEASURED ZERO from the search above, not a step that was" >> "$VPF"
            echo " skipped. The profile may be built at runtime rather than" >> "$VPF"
            echo " stored, in which case the engine source, not the tree, is" >> "$VPF"
            echo " where the clause lives.)" >> "$VPF"
          fi
          echo "profile file bytes : $(wc -c < "$VPF" 2>/dev/null)"
          # PLAIN TEXT, NOT --json. Run 33160904128 got zero bytes from
          # `vulkaninfo --json` while `--summary` had worked moments earlier,
          # so this build of vulkaninfo does not serve that switch. The full
          # text output carries the same features and limits.
          {
            echo "command : vulkaninfo"
            echo "run     : ${GITHUB_RUN_ID}"
            echo "---"
          } > "$VKF"
          $PFX sh -c 'vulkaninfo 2>&1' >> "$VKF" 2>/dev/null
          echo "device text bytes : $(wc -c < "$VKF" 2>/dev/null)"
          # ------------------------------------------------------------------
          # WHERE THE REFUSAL ACTUALLY COMES FROM, and a LIKE-FOR-LIKE device
          # read. Run 33204569737 settled that it is NOT the profile: the whole
          # of VP_UE_Vulkan_SM5 is three conditions -- apiVersion >= 1.1.0,
          # fragmentStoresAndAtomics == VK_TRUE, maxBoundDescriptorSets >= 4,
          # with extensions, formats and queue families all `0, nullptr` -- and
          # lavapipe answers 1.3.255, true and 8. All three pass, and the engine
          # still says "None of the 1 devices meet all the criteria!".
          #
          # So this asks the two questions that are left, in ONE pull, because
          # a pull is 22.9 GB and nothing persists between jobs:
          #
          #   A. which code emits that sentence, and what else it tests. The
          #      message is the only thread back to the real criteria.
          #   B. what the device looks like through the ENGINE'S OWN loader.
          #      The engine logs `Using included Vulkan loader` at instance
          #      1.3.204 from Engine/Binaries/ThirdParty/Vulkan/Linux, while
          #      vulkaninfo read the device through the SYSTEM loader at
          #      1.3.255. The two dumps we have are therefore NOT strictly
          #      comparable, and a difference is a candidate.
          #
          # $RUNNER_TEMP again, never the workspace: the tree belongs to the
          # image's user until the report step chowns back, and run 33200211918
          # lost both dumps to exactly that.
          DGF="$RUNNER_TEMP/engine_device_criteria.txt"
          {
            echo "run     : ${GITHUB_RUN_ID}"
            echo "purpose : the refusal is NOT the profile (run 33204569737)."
            echo "          A: what code emits the sentence and what it tests."
            echo "          B: the device through the ENGINE'S bundled loader."
            echo ""
            echo "== A. every source file carrying the refusal message =="
          } > "$DGF"
          $PFX sh -c 'grep -rn "meet all the criteria" /home/ue4/UnrealEngine/Engine/Source 2>/dev/null | head -10' \
            >> "$DGF" 2>&1
          {
            echo ""
            echo "== A2. the device-selection neighbourhood =="
            echo "(grep -n on VulkanRHI for the selection and profile calls;"
            echo " a count of 0 with the tree ABSENT is a failure to measure,"
            echo " so the tree is listed first.)"
            echo "--- does the source tree exist at all ---"
          } >> "$DGF"
          $PFX sh -c 'ls -d /home/ue4/UnrealEngine/Engine/Source/Runtime/VulkanRHI 2>&1; ls /home/ue4/UnrealEngine/Engine/Source/Runtime/VulkanRHI/Private 2>&1 | head -20' \
            >> "$DGF" 2>&1
          {
            echo "--- lines naming the profile check or device selection ---"
          } >> "$DGF"
          $PFX sh -c 'grep -rn "vpGetPhysicalDeviceProfileSupport\|GetPhysicalDeviceProfileSupport\|meet all the criteria\|SupportsProfile\|IsDeviceSuitable" /home/ue4/UnrealEngine/Engine/Source/Runtime/VulkanRHI 2>/dev/null | head -30' \
            >> "$DGF" 2>&1
          {
            echo ""
            echo "== A3. 160 lines around the first hit, whichever file it is =="
          } >> "$DGF"
          $PFX sh -c 'F=$(grep -rl "meet all the criteria" /home/ue4/UnrealEngine/Engine/Source 2>/dev/null | head -1); if [ -n "$F" ]; then echo "file: $F"; N=$(grep -n "meet all the criteria" "$F" | head -1 | cut -d: -f1); A=$((N-120)); [ $A -lt 1 ] && A=1; sed -n "${A},$((N+40))p" "$F"; else echo "(no source file carries that string -- it may live only in a compiled binary, which is itself the finding)"; fi' \
            >> "$DGF" 2>&1
          {
            echo ""
            echo "== B. the device through the ENGINE'S OWN bundled loader =="
            echo "LD_LIBRARY_PATH is pointed at the engine's Vulkan directory,"
            echo "so vulkaninfo resolves libvulkan through the SAME loader the"
            echo "engine logs as 'Using included Vulkan loader'. A difference"
            echo "from the system-loader dump is a candidate; sameness rules"
            echo "the loader out, which is worth as much."
            echo "--- engine Vulkan directory ---"
          } >> "$DGF"
          $PFX sh -c 'ls -l /home/ue4/UnrealEngine/Engine/Binaries/ThirdParty/Vulkan/Linux 2>&1 | head -20' \
            >> "$DGF" 2>&1
          {
            echo "--- vulkaninfo through it ---"
          } >> "$DGF"
          $PFX sh -c 'LD_LIBRARY_PATH=/home/ue4/UnrealEngine/Engine/Binaries/ThirdParty/Vulkan/Linux:$LD_LIBRARY_PATH vulkaninfo 2>&1 | head -200' \
            >> "$DGF" 2>&1
          echo "criteria file bytes : $(wc -c < "$DGF" 2>/dev/null)"
          # ------------------------------------------------------------------
          echo "cpu_devices=$CPU_DEV" >> "$GITHUB_OUTPUT"
          echo "gpu_devices=$GPU_DEV" >> "$GITHUB_OUTPUT"
          if [ "${CPU_DEV:-0}" = "0" ] && [ "${GPU_DEV:-0}" = "0" ]; then
            echo "rc=82" >> "$GITHUB_OUTPUT"
            echo "ICDs are present and NOTHING enumerated. rc 82."
            exit 0
          fi
          echo "rc=0" >> "$GITHUB_OUTPUT"

      - name: Render Valiasr offscreen
        id: render
        if: ${{ steps.secret.outputs.ok == 'yes' && steps.vk.outputs.rc == '0' && inputs.render }}
        env:
          CMD: ${{ steps.find.outputs.editor || steps.pull.outputs.editor }}
          PFX: ${{ steps.pull.outputs.exec }}
        run: |
          set +e
          PROJ="$GITHUB_WORKSPACE/work/TehranBlindSpot.uproject"
          LOG="$GITHUB_WORKSPACE/render.log"
          rm -f "$LOG" /tmp/render.stdout /tmp/render.digests
          # -AllowCPUDevices IS THE FIX, AND IT IS ONE FLAG.
          #
          # Run 33304835669 read the engine source (no image, no ghcr):
          # Engine/Source/Runtime/VulkanRHI/Private/VulkanRHI.cpp
          #
          #   257  const bool bAllowCPUDevices =
          #          FParse::Param(FCommandLine::Get(), TEXT("AllowCPUDevices"))
          #       || FParse::Param(FCommandLine::Get(), TEXT("AllowSoftwareRendering"));
          #   260  if (!bAllowCPUDevices && (... .deviceType == VK_PHYSICAL_DEVICE_TYPE_CPU))
          #   268  UE_LOGF(..., "None of the %u devices meet all the criteria!", ...)
          #
          # The device is DISCARDED FOR BEING A CPU eight lines before that
          # message, so the message is not about the SM5 criteria at all.
          # That is why run 33204569737 measured all three clauses of
          # VP_UE_Vulkan_SM5 as satisfied and the engine refused anyway.
          #
          # ~~Verbose is what makes the device selection print its reasons.~~
          # MEASURED FALSE, run 33200211918: lines 1145-1148 of that log show
          # NOTHING between "Starting Vulkan Profile check" and the warning.
          # The engine names no clause at any verbosity -- because there was
          # no failing clause. Kept only so its absence stays visible in the
          # next log; it is not buying the diagnosis it was added for.
          #
          # WHAT THIS FLAG DOES AND DOES NOT SETTLE: it makes the device
          # ELIGIBLE. It does not prove the profile check then passes, nor
          # that anything renders. Those are the next measurements, and a
          # PNG on disk is still the only thing that means a frame exists.
          #
          # NO -NullRHI. That flag is the whole difference between the boot
          # step above and this one: it means no RHI at all, so nothing can
          # render. The flags here are the ones Tools/ue.py already uses for
          # its own render path, copied rather than invented.
          # A TIMESTAMP MARKER, NOT THE .uproject. `-newer $PROJ` would have
          # counted the 174 LFS REFERENCE PNGs as frames this run produced:
          # with lfs:true they materialise at checkout, which is newer than
          # nothing and older than everything. A marker made HERE cannot.
          touch /tmp/render.mark
          BEGAN=$(date +%s)
          timeout 2400 $PFX "$CMD" "$PROJ" \
            -ExecutePythonScript="$GITHUB_WORKSPACE/work/Tools/probe_district.py" \
            -RenderOffScreen -ResX=1280 -ResY=720 \
            -AllowCPUDevices \
            -LogCmds="LogVulkanRHI Verbose" \
            -unattended -nopause -nosplash -stdout \
            -abslog="$LOG" > /tmp/render.stdout 2>&1
          RC=$?
          SECS=$(( $(date +%s) - BEGAN ))
          echo "rc=$RC"     >> "$GITHUB_OUTPUT"
          echo "secs=$SECS" >> "$GITHUB_OUTPUT"
          echo "render rc=$RC in ${SECS}s"
          : > /tmp/render.digests
          for F in "$LOG" /tmp/render.stdout; do
            [ -f "$F" ] && grep -hE '##TBS##[[:space:]]*\{' "$F" >> /tmp/render.digests 2>/dev/null
          done
          sed -i 's/^.*\(##TBS##\)/\1/' /tmp/render.digests
          sort -u /tmp/render.digests -o /tmp/render.digests
          TBS=$(wc -l < /tmp/render.digests | tr -d " ")
          echo "tbs=$TBS" >> "$GITHUB_OUTPUT"
          echo "##TBS## lines produced : $TBS"
          # A PNG ON DISK IS THE ONLY THING THAT MEANS A FRAME EXISTS. A probe
          # reporting pass and a file being written are different claims, and
          # this project has a scar for trusting the first.
          SHOTS=$(find "$GITHUB_WORKSPACE/work/Reports" -name '*.png' -newer /tmp/render.mark 2>/dev/null | wc -l | tr -d " ")
          echo "pngs=$SHOTS" >> "$GITHUB_OUTPUT"
          echo "PNG files written : $SHOTS"
          find "$GITHUB_WORKSPACE/work/Reports" -name '*.png' -newer /tmp/render.mark \
            -printf '  %10s  %p\n' 2>/dev/null | head -20
          # READ THE PROPERTY BACK. -AllowCPUDevices being on the command
          # line and the engine ACTING on it are different claims, and this
          # project has a scar for trusting the first (a write that silently
          # did nothing and a setting that does nothing measure identically).
          # These four lines are what say which happened, and they cost
          # nothing -- the log is already on disk.
          echo "--- did the CPU device get past the gate? ---"
          # THE ENGINE MUST HAVE RUN BEFORE ITS SILENCE MEANS ANYTHING.
          # Run 33307313953: ghcr refused all three pull attempts, $CMD was
          # empty, timeout died with rc 127 in 0s -- and this block printed
          # "GATE: message ABSENT", because a log that does not exist has no
          # rejection in it. That is a failure to measure reported as a
          # value, which is the one thing this project forbids outright.
          # A run that produced no engine log now says so and stops.
          if ! grep -qE "LogVulkanRHI|LogInit|LogCore" \
                 "$LOG" /tmp/render.stdout 2>/dev/null; then
            echo "GATE: NOT MEASURED -- the engine produced no log at all."
            echo "      rc=$RC. Nothing here says anything about the device;"
            echo "      the run died before the engine spoke. Check the pull"
            echo "      and the editor path, not the gate."
          elif grep -qE "None of the [0-9]+ devices meet all the criteria" \
               "$LOG" /tmp/render.stdout 2>/dev/null; then
            echo "GATE: STILL REJECTED -- the rejection message is still there."
            echo "      -AllowCPUDevices did NOT get the device through, and"
            echo "      whatever refuses it now is a DIFFERENT cause from the"
            echo "      one run 33304835669 found. Do not re-credit that one."
          else
            echo "GATE: message ABSENT -- the device was not rejected this way."
            echo "      This is necessary, NOT sufficient: absence of the"
            echo "      rejection is not the presence of a frame. The PNG"
            echo "      count above is what says whether anything rendered."
          fi
          echo "--- what the engine says it selected ---"
          grep -hE "Found device|Chosen device|Selected Device|DeviceID=|Using device|Device [0-9]+:" \
            "$LOG" /tmp/render.stdout 2>/dev/null | head -12
          echo "--- the Vulkan profile check, in its own words ---"
          grep -hE "Vulkan Profile check|SF_VULKAN_SM5|Skipping" \
            "$LOG" /tmp/render.stdout 2>/dev/null | head -12
          echo "--- the digest lines themselves ---"
          cat /tmp/render.digests
          echo "--- last 60 lines the editor printed ---"
          tail -60 /tmp/render.stdout 2>/dev/null
          echo "--- last 60 lines of the editor's OWN log ---"
          tail -60 "$LOG" 2>/dev/null

      - name: Symbolise the crash the render died on
        id: crash
        if: ${{ always() && steps.render.outputs.rc != '0' && steps.render.outputs.rc != '' }}
        env:
          PFX: ${{ steps.pull.outputs.exec }}
        run: |
          set +e
          # Run 33305367382 got the device accepted and then died rc 139
          # (SIGSEGV) with ONE unsymbolised frame:
          #     libc.so.6!UnknownFunction(0x4251f)
          # which names nothing. The engine writes a crashinfo directory
          # containing its own context and log, and neither has ever been
          # brought home. This step exists to make the next claim about WHY
          # it crashes rest on a named function instead of on the last line
          # that happened to be logged.
          #
          # ALWAYS + rc != '' : an empty rc means the render step never ran,
          # and NOT MEASURED is a different answer from a crash. A skipped
          # render must not produce a crash report saying nothing was found.
          OUT="$RUNNER_TEMP/crash_report.txt"
          SAVED="$GITHUB_WORKSPACE/work/Saved"
          {
            echo "when        : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "render rc   : ${{ steps.render.outputs.rc }}"
            echo ""

            echo "== 1. WHAT CRASH ARTEFACTS EXIST =="
            find "$SAVED" -maxdepth 3 \( -name 'crashinfo*' -o -name '*.dmp' \
              -o -name 'CrashContext*' -o -name 'core*' \) 2>/dev/null | head -20
            CI=$(find "$SAVED/Crashes" -maxdepth 1 -type d -name 'crashinfo*' 2>/dev/null | head -1)
            echo "crashinfo dir: ${CI:-<none>}"
            echo ""

            if [ -n "$CI" ]; then
              echo "== 2. THE CRASH CONTEXT, as the engine recorded it =="
              # CallStack and Modules are the two elements worth having; the
              # xml is large and most of it is machine description.
              for F in "$CI"/CrashContext.runtime-xml "$CI"/*.log; do
                [ -f "$F" ] || continue
                echo "-- $F"
                grep -aE "CallStack|SourceContext|ErrorMessage|CrashType|Signal" \
                  "$F" 2>/dev/null | head -40
              done
              echo ""
            else
              echo "== 2. NOT MEASURED: no crashinfo directory =="
              echo "The engine did not leave one, or it is not under $SAVED."
              echo "This is a failure to find it, NOT evidence that the crash"
              echo "produced nothing."
              echo ""
            fi

            echo "== 3. IS THERE A SYMBOLISER IN THE IMAGE AT ALL? =="
            # Named individually so a missing one is a stated absence rather
            # than a silent skip -- 'gdb not installed' and 'gdb found no
            # frames' are different answers and must not read alike.
            for T in gdb addr2line eu-addr2line nm objdump; do
              P=$($PFX sh -c "command -v $T" 2>/dev/null)
              echo "  $T : ${P:-<absent>}"
            done
            echo ""

            echo "== 4. THE ENGINE'S OWN CALLSTACK LINES =="
            grep -aE "^0x[0-9a-f]+|UnknownFunction|!.*\(0x" \
              "$GITHUB_WORKSPACE/render.log" /tmp/render.stdout 2>/dev/null | head -30
            echo ""

            echo "VERDICT: CRASH ARTEFACTS COLLECTED. Whether they name a"
            echo "         function is what sections 2 and 4 say. A frame"
            echo "         count is not a diagnosis."
          } > "$OUT" 2>&1
          cat "$OUT"
          # The whole crashinfo directory goes home too -- it is small, and
          # the alternative is another 22.9 GB pull to ask it one more thing.
          if [ -n "$SAVED" ] && [ -d "$SAVED/Crashes" ]; then
            mkdir -p "$RUNNER_TEMP/crashes"
            cp -r "$SAVED/Crashes/." "$RUNNER_TEMP/crashes/" 2>/dev/null
            echo "copied crashes dir: $(du -sh "$RUNNER_TEMP/crashes" 2>/dev/null | cut -f1)"
          fi

      - name: Mirror roundtrip -- can Releases hold the image at all?
        id: mirror_probe
        if: ${{ inputs.mirror == 'roundtrip' }}
        env:
          TBS_PRIVATE_TOKEN: ${{ secrets.TBS_PRIVATE_TOKEN }}
        run: |
          set +e
          # NO PULL. This settles whether the store works before anything
          # bets 22.9 GB on it. The cloud container could not test it: its
          # own token answers HTTP 403 "Creating, editing, or deleting
          # releases is not permitted for this session type", which is a
          # fact about THAT credential and not about this one.
          python3 "$GITHUB_WORKSPACE/work/Tools/engine_mirror.py" roundtrip \
            --repo Mohammadlali/Claud-Cloud-Project \
            --tag engine-mirror-roundtrip
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Mirror save -- put the pulled image on a Release
        id: mirror_save
        if: ${{ inputs.mirror == 'save' && steps.pull.outputs.rc == '0' }}
        env:
          TBS_PRIVATE_TOKEN: ${{ secrets.TBS_PRIVATE_TOKEN }}
          IMG: ghcr.io/epicgames/unreal-engine:dev-slim-5.8.2
        run: |
          set +e
          # Runs ONLY after a pull that succeeded, so building the mirror
          # costs zero extra pulls -- the image is already on this disk.
          M="$GITHUB_WORKSPACE/work/Tools/engine_mirror.py"
          df -h / | tail -1
          python3 "$M" save --image "$IMG" --work "$RUNNER_TEMP/mirror"
          SRC=$?
          echo "save_rc=$SRC" >> "$GITHUB_OUTPUT"
          if [ "$SRC" -ne 0 ]; then
            echo "save failed -- nothing uploaded. The digest above says why."
            exit 0
          fi
          python3 "$M" upload --repo Mohammadlali/Claud-Cloud-Project \
            --tag engine-mirror-dev-slim-5.8.2 \
            --parts "$RUNNER_TEMP/mirror/parts"
          echo "upload_rc=$?" >> "$GITHUB_OUTPUT"
          rm -rf "$RUNNER_TEMP/mirror"

      - name: Hand the workspace back to the runner user
        if: ${{ always() }}
        run: |
          set +e
          # The workspace was handed to the image's user so the container
          # could write into it. Every step after this one runs as the runner
          # user, and `git add` on a tree it cannot stat is a confusing way to
          # lose a report. Hand it back on the HOST with sudo -- the container
          # is the wrong place for it, because it may not be running and its
          # user is exactly the one that must stop owning these files.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" > /tmp/chownback.txt 2>&1
          echo "chown back rc=$? -- a cleanup, not a measurement:"
          echo "a non-zero here does not invalidate any number above it."
          tail -3 /tmp/chownback.txt 2>/dev/null

      - name: Write the report and push it to the PRIVATE repo
        id: deliver
        if: ${{ always() && steps.secret.outputs.ok == 'yes' }}
        working-directory: work
        env:
          RUN_ID:  ${{ github.run_id }}
          FREE0:   ${{ steps.room.outputs.free }}
          FREEM:   ${{ steps.room.outputs.free_mnt }}
          W_DL:    ${{ steps.room.outputs.writable_dl }}
          W_UE:    ${{ steps.room.outputs.writable_ue }}
          SRC:     ${{ inputs.source }}
          P_RC:    ${{ steps.pull.outputs.rc }}
          P_TRIES: ${{ steps.pull.outputs.pull_tries }}
          P_SECS:  ${{ steps.pull.outputs.secs }}
          P_DF:    ${{ steps.pull.outputs.dockerdf }}
          P_FREE:  ${{ steps.pull.outputs.free }}
          P_WR:    ${{ steps.pull.outputs.wr }}
          P_UID:   ${{ steps.pull.outputs.runuid }}
          D_RC:    ${{ steps.dl.outputs.rc }}
          D_SECS:  ${{ steps.dl.outputs.secs }}
          D_MB:    ${{ steps.dl.outputs.mb }}
          D_MSG:   ${{ steps.dl.outputs.msg }}
          U_RC:    ${{ steps.unzip.outputs.rc }}
          U_SECS:  ${{ steps.unzip.outputs.secs }}
          U_MB:    ${{ steps.unzip.outputs.mb }}
          U_TIGHT: ${{ steps.unzip.outputs.tight }}
          U_FREE:  ${{ steps.unzip.outputs.free }}
          U_MNT:   ${{ steps.unzip.outputs.mntfree }}
          F_FOUND: ${{ steps.find.outputs.found || (steps.pull.outputs.editor && 'yes') }}
          F_CMD:   ${{ steps.find.outputs.editor || steps.pull.outputs.editor }}
          C_RC:    ${{ steps.build.outputs.rc }}
          C_SECS:  ${{ steps.build.outputs.secs }}
          C_SO:    ${{ steps.build.outputs.so }}
          B_RC:    ${{ steps.boot.outputs.rc }}
          B_SECS:  ${{ steps.boot.outputs.secs }}
          B_TBS:   ${{ steps.boot.outputs.tbs }}
          B_LOGSEEN: ${{ steps.boot.outputs.logseen }}
          B_OUTSEEN: ${{ steps.boot.outputs.outseen }}
          V_RC:    ${{ steps.vk.outputs.rc }}
          V_CPU:   ${{ steps.vk.outputs.cpu_devices }}
          V_GPU:   ${{ steps.vk.outputs.gpu_devices }}
          R_RC:    ${{ steps.render.outputs.rc }}
          R_SECS:  ${{ steps.render.outputs.secs }}
          R_TBS:   ${{ steps.render.outputs.tbs }}
          R_PNGS:  ${{ steps.render.outputs.pngs }}
          DO_COMMIT: ${{ inputs.commit }}
          BRANCH:  ${{ vars.TBS_BRANCH || 'claude/gateway-auth-fix-nr7k0b' }}
        run: |
          set +e
          OUT="Reports/cloud_host/engine_prebuilt_${RUN_ID}.txt"
          mkdir -p Reports/cloud_host
          {
            echo "Epic's PREBUILT Linux Unreal Engine on a public hosted runner."
            echo ""
            echo "instrument : Mohammadlali/Runner .github/workflows/prebuilt.yml"
            echo "run        : ${RUN_ID}"
            echo "when       : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "source     : Linux_Unreal_Engine_5.8.2.zip, 37.08 GB,"
            echo "             dated 2026-08-25, unrealengine.com/linux"
            echo "machine    : $(nproc) cores, $(free -g | awk '/^Mem:/{print $2}') GB ram"
            echo "free at start of work : / ${FREE0:-<none>} GB,"
            echo "                        /mnt ${FREEM:-<none>} GB"
            echo "write test, /mnt/dl        : rc ${W_DL:-<step did not run>}"
            echo "write test, /home/runner/ue: rc ${W_UE:-<step did not run>}"
            echo ""
            echo "engine source : ${SRC:-<none>}"
            echo ""
            echo "== pull, ghcr.io/epicgames/unreal-engine:dev-slim-5.8.2 =="
            echo "rc            : ${P_RC:-<step did not run>}"
            echo "pull attempts : ${P_TRIES:-<none>} of 3 -- more
                            than 1 means ghcr.io rate-limited us and
                            the retry recovered it, which is NOT the
                            same run as one that pulled first time"
            echo "pull seconds  : ${P_SECS:-<none>}"
            echo "docker on disk: ${P_DF:-<none>}"
            echo "free on /     : ${P_FREE:-<none>} GB"
            echo "write into bind mount : ${P_WR:-<not tested>}"
            echo "uid the engine ran as : ${P_UID:-<not read>}"
            echo "  NOTHING IS COPIED OUT of the image on this route: the"
            echo "  workspace is bind-mounted in and the build runs inside,"
            echo "  so only ONE engine tree exists on disk. Copying it out"
            echo "  would put a second one beside it, and the zip route"
            echo "  already came within 6 GB of the wall doing that."
            echo "  rc 70 = docker login refused. rc 71 = NO UnrealEditor-Cmd"
            echo "  anywhere in the image, the real answer to whether"
            echo "  dev-slim carries an editor. rc 73/74 = the container did"
            echo "  not start or did not stay up. rc 75 = the bind mount did"
            echo "  not arrive. rc 76 = the image's default uid could not be"
            echo "  READ, which is not the same answer as a uid of 0. rc 77 ="
            echo "  that uid IS 0, and Unreal refuses to start as root -- run"
            echo "  33049314055 said exactly that in its own words. rc 78 ="
            echo "  the workspace could not be handed to the image's user."
            echo ""
            echo "== download (zip source only) =="
            echo "rc         : ${D_RC:-<step did not run>}"
            echo "seconds    : ${D_SECS:-<none>}"
            echo "MB         : ${D_MB:-<none>}"
            echo "curl said  : ${D_MSG:-<step did not run>}"
            echo ""
            echo "== unzip =="
            echo "rc         : ${U_RC:-<step did not run>}"
            echo "seconds    : ${U_SECS:-<none>}"
            echo "tree MB    : ${U_MB:-<none>}"
            echo "free on /    after extraction    : ${U_TIGHT:-<none>} GB"
            echo "free on /    after deleting zip  : ${U_FREE:-<none>} GB"
            echo "free on /mnt after deleting zip  : ${U_MNT:-<none>} GB"
            echo ""
            echo "== the editor binary =="
            echo "found      : ${F_FOUND:-<step did not run>}"
            echo "path       : ${F_CMD:-<none>}"
            echo ""
            echo "== build, TehranBlindSpotEditor Linux Development =="
            echo "rc         : ${C_RC:-<step did not run>}"
            echo "seconds    : ${C_SECS:-<none>}"
            echo "binary on disk : ${C_SO:-<none>}"
            echo "  rc 90 means the .uproject was missing, rc 91 means the"
            echo "  engine tree had no Build.sh. Neither is a compile error."
            echo "  ANY OTHER non-zero rc is the build tool's own, and the"
            echo "  log below is the only thing that says which. Run"
            echo "  33047625082 reported rc 6 in 1 second with no log in this"
            echo "  file at all, so nobody could tell a compile error from a"
            echo "  permission error without opening Actions."
            # THE HEAD AS WELL AS THE TAIL. The toolchain banner, the UBA
            # storage line and any warning about it all sit near the TOP of
            # this log, and a build that hangs never reaches a tail worth
            # having. Run 33050798591 succeeded and its report carried only
            # `tail -40`, starting at "[4/8] Compile TBSGameMode.cpp" -- so
            # when 33066212937 hung with a /dev/shm warning, there was no way
            # to ask whether the successful run had printed the same warning.
            # That question is still unanswerable for those two runs.
            echo "--- first 30 lines of the build log ---"
            head -30 /tmp/build.log 2>/dev/null || echo "(none)"
            echo "--- last 40 lines of the build log ---"
            tail -40 /tmp/build.log 2>/dev/null || echo "(none)"
            echo ""
            echo "== boot, -NullRHI, running Tools/probe_boot.py =="
            echo "rc         : ${B_RC:-<step did not run>}"
            echo "seconds    : ${B_SECS:-<none>}"
            echo "##TBS## lines : ${B_TBS:-<none>}"
            echo "editor log file present : ${B_LOGSEEN:-<step did not run>}"
            echo "stdout captured         : ${B_OUTSEEN:-<step did not run>}"
            echo "  A count of 0 with the log ABSENT is a failure to capture,"
            echo "  not a probe that stayed silent. Run 33050798591 could not"
            echo "  tell those apart: it counted '^##TBS##' against a log that"
            echo "  was written inside the container, and an engine log never"
            echo "  starts a line with the marker anyway."
            echo "--- every ##TBS## line the boot produced ---"
            cat /tmp/boot.digests 2>/dev/null || echo "(none)"
            echo ""
            echo "== can this container render at all =="
            echo "vulkan step rc     : ${V_RC:-<step did not run>}"
            echo "software devices   : ${V_CPU:-<none>}"
            echo "hardware GPU dev   : ${V_GPU:-<none>}"
            echo "  rc 80 = no Vulkan loader in the image, which is a MISSING"
            echo "  LIBRARY and not a machine that cannot render. rc 81 = a"
            echo "  loader with no ICD. rc 82 = ICDs present, nothing"
            echo "  enumerated. A SOFTWARE device is the expected answer here:"
            echo "  there is no GPU on this machine, and lavapipe rendering is"
            echo "  NOT a claim that a GPU rendered. See"
            echo "  Reports/cloud_host/kaggle_vulkan_2026-08-26.CORRECTION.md,"
            echo "  which exists because a digest once collapsed that."
            echo ""
            echo "== render, -RenderOffScreen, Tools/probe_district.py =="
            echo "rc            : ${R_RC:-<step did not run>}"
            echo "seconds       : ${R_SECS:-<none>}"
            echo "##TBS## lines : ${R_TBS:-<none>}"
            echo "PNG files     : ${R_PNGS:-<none>}"
            echo "  A PNG ON DISK is the only thing that means a frame exists."
            echo "  A probe reporting pass and a file being written are"
            echo "  different claims."
            echo "--- every ##TBS## line the render produced ---"
            cat /tmp/render.digests 2>/dev/null || echo "(none)"
            echo "--- last 40 lines the render printed ---"
            tail -40 /tmp/render.stdout 2>/dev/null || echo "(none)"
            echo "--- last 40 lines of the render editor's OWN log ---"
            tail -40 "$GITHUB_WORKSPACE/render.log" 2>/dev/null || echo "(none)"
            echo "  ADDED after run 33151148400 reported render rc 1 with a"
            echo "  green build above it and NO WAY TO SEE WHY. The editor's"
            echo "  own log was written and never printed, so the cause was"
            echo "  not measured -- the same gap fixed for the boot step and"
            echo "  repeated here."
            echo ""
            echo "== VERDICT =="
            if [ "${C_RC:-x}" != "0" ] && [ "${C_RC:-x}" != "x" ]; then
              echo "READ THE BUILD SECTION FIRST: the module did not compile,"
              echo "so any boot failure below is downstream of that and says"
              echo "nothing about the engine or the machine."
            fi
            # BRANCH ON THE ROUTE FIRST. Run 33047625082 pulled an image,
            # found the editor, built and booted -- and this section told its
            # reader "NOT MEASURED past the download", because D_RC is empty
            # on the image route and an empty string is not "0". A verdict
            # that describes a step which never ran is worse than no verdict.
            if [ "${SRC}" = "image" ] && [ "${P_UID}" = "0" ]; then
              echo "THE ENGINE RAN AS ROOT AND UNREAL REFUSES TO DO THAT."
              echo "Its own words, from run 33049314055: 'Refusing to run with"
              echo "the root privileges.' The build passes as root and the"
              echo "boot cannot, so a green build above this line is not"
              echo "evidence that the boot was ever going to work."
            elif [ "${SRC}" = "image" ] && [ "${P_WR}" = "no" ]; then
              echo "THE CONTAINER CANNOT WRITE INTO THE BIND-MOUNTED"
              echo "WORKSPACE. Every rc below this line is downstream of that"
              echo "and none of them is a statement about the engine, the"
              echo "image or the machine."
            elif [ "${SRC}" = "image" ] && [ "${P_RC}" != "0" ]; then
              echo "NOT MEASURED past the pull. rc ${P_RC:-<none>}."
              echo "rc 70 is docker login refused -- a credential, not a"
              echo "size. rc 71 is an image with no UnrealEditor-Cmd in it."
              echo "rc 73/74/75 are the container and the mount. None of"
              echo "these is 'the engine does not run'."
            elif [ "${SRC}" != "image" ] && [ "${D_RC}" != "0" ]; then
              echo "NOT MEASURED past the download. rc ${D_RC:-<none>}, and"
              echo "curl said: ${D_MSG:-<nothing was captured>}"
              echo "rc 22 is an expired signature, rc 23 is a write error,"
              echo "and neither is the same answer as 'the engine does not"
              echo "fit' or 'the engine does not run'."
            elif [ "${SRC}" != "image" ] && [ "${U_RC}" != "0" ]; then
              echo "The archive did not extract. Check the free-space numbers"
              echo "above before blaming the archive."
            elif [ "${F_FOUND}" != "yes" ]; then
              echo "The engine arrived, and there is NO UnrealEditor-Cmd in"
              echo "it. Whatever this ${SRC} is, it is not a runnable editor."
            elif [ "${B_RC}" = "0" ] && [ "${B_TBS:-0}" -gt 0 ]; then
              echo "THE EDITOR STARTS ON A GITHUB RUNNER AND OUR PROBE RAN"
              echo "INSIDE IT: ${B_TBS} ##TBS## lines, printed above. First"
              echo "time in this project that Unreal has run anywhere but the"
              echo "laptop. This says nothing about RENDERING: the run was"
              echo "-NullRHI, and there is no GPU on this machine."
            elif [ "${B_RC}" = "0" ]; then
              echo "THE EDITOR STARTED AND EXITED 0, AND NOTHING PROVES OUR"
              echo "PROBE RAN INSIDE IT: zero ##TBS## lines. The editor"
              echo "booting and Tools/probe_boot.py executing are DIFFERENT"
              echo "QUESTIONS and only the first is answered here. Read the"
              echo "two presence flags above before reading this as silence"
              echo "from the probe."
            else
              echo "The engine is here and the binary is there, but the"
              echo "editor did not exit 0. Its own output is below; read it"
              echo "before concluding the machine is at fault -- and read the"
              echo "build section above it first, because a module that did"
              echo "not compile makes the editor exit for a reason that has"
              echo "nothing to do with the runner."
            fi
            echo ""
            echo "== last 60 lines the editor printed =="
            tail -60 /tmp/boot.stdout 2>/dev/null || echo "(none)"
            echo ""
            echo "== last 60 lines of the editor's log =="
            tail -60 "$GITHUB_WORKSPACE/boot.log" 2>/dev/null || echo "(none)"
          } > "$OUT"
          echo "wrote $OUT"

          if [ "$DO_COMMIT" != "true" ]; then
            echo "delivered=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f Tools/push_with_merge.sh ]; then
            echo "Tools/push_with_merge.sh is missing from the checkout."
            echo "delivered=no" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git config user.name  "tbs-runner"
          git config user.email "noreply@github.com"
          git add "$OUT"
          # THE FRAMES THEMSELVES. Without these the render is a number in a
          # report and the cloud side still cannot see anything -- and seeing
          # is the entire point of rung 4. Added only if any exist, so a run
          # that rendered nothing still delivers the report saying so.
          # Reports/district is where probe_district.py puts its shots --
          # OUT_DIR at Tools/probe_district.py:35, read rather than assumed.
          if [ -d Reports/district ] && [ -n "$(ls -A Reports/district 2>/dev/null)" ]; then
            git add -f Reports/district
          fi
          # THE CRASH ARTEFACTS. Run 33305367382 died rc 139 with one
          # unsymbolised frame, and the engine's own crashinfo directory
          # was never brought home -- so the next question about WHY would
          # have cost another 22.9 GB pull to ask. These are small.
          # Copied from $RUNNER_TEMP because the crash step runs BEFORE the
          # chown back and cannot write into the workspace (the Permission
          # denied that cost run 33200211918 two dumps).
          if [ -f "$RUNNER_TEMP/crash_report.txt" ]; then
            mkdir -p Reports/cloud_host
            cp "$RUNNER_TEMP/crash_report.txt" \
               "Reports/cloud_host/crash_report_${RUN_ID}.txt"
            git add -f "Reports/cloud_host/crash_report_${RUN_ID}.txt"
          fi
          if [ -d "$RUNNER_TEMP/crashes" ] && [ -n "$(ls -A "$RUNNER_TEMP/crashes" 2>/dev/null)" ]; then
            mkdir -p "Reports/cloud_host/crashes_${RUN_ID}"
            # Text only. A minidump is a binary this repo has no symboliser
            # for, and committing megabytes nobody can read is not delivery.
            find "$RUNNER_TEMP/crashes" -type f \
              \( -name '*.log' -o -name '*.xml' -o -name '*.runtime-xml' \
                 -o -name '*.txt' -o -name '*.ini' \) \
              -size -2M -exec cp {} "Reports/cloud_host/crashes_${RUN_ID}/" \; 2>/dev/null
            if [ -n "$(ls -A "Reports/cloud_host/crashes_${RUN_ID}" 2>/dev/null)" ]; then
              git add -f "Reports/cloud_host/crashes_${RUN_ID}"
            fi
          fi
          # The profile Epic demands and the device lavapipe offers. These are
          # what turn "none of the devices meet all the criteria" into a named
          # clause, and they cannot be read from the cloud side any other way:
          # the engine tree lives inside the image.
          #
          # `-f`, NOT `-s`. The old guard skipped any file that was not
          # non-empty, so a search that ran and found nothing produced exactly
          # the same absence as a runner whose workflow had no dump step at
          # all. The vk step now always writes a header naming the search and
          # its hit count, so an empty result is impossible and a MISSING file
          # means one thing only: that step did not run.
          # COPIED IN HERE, from $RUNNER_TEMP, because the vk step could not
          # write into the workspace: it runs while the tree belongs to the
          # image's user. By this point the chown back has happened, which is
          # why the report file above lands without trouble.
          for N in vp_ue_vulkan_sm5 lavapipe_vulkaninfo engine_device_criteria; do
            if [ -f "$RUNNER_TEMP/$N.txt" ]; then
              cp "$RUNNER_TEMP/$N.txt" "Reports/cloud_host/$N.txt"
            fi
          done
          for F in Reports/cloud_host/vp_ue_vulkan_sm5.txt \
                   Reports/cloud_host/lavapipe_vulkaninfo.txt \
                   Reports/cloud_host/engine_device_criteria.txt; do
            [ -f "$F" ] && git add -f "$F"
          done
          git commit -m "prebuilt engine: measured on the public runner, run ${RUN_ID}"
          if [ $? -ne 0 ]; then
            echo "nothing to commit."
            echo "delivered=no" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          H=$(git rev-parse --short HEAD)
          python3 Tools/record_commit.py "$H" \
            "Epic's prebuilt Linux engine on the public runner (\`${OUT}\`), run ${RUN_ID}: download rc=${D_RC} in ${D_SECS}s for ${D_MB}MB, unzip rc=${U_RC} in ${U_SECS}s to ${U_MB}MB, editor found=${F_FOUND}, boot rc=${B_RC} in ${B_SECS}s. Written by \`Runner\` \`prebuilt.yml\`, not by a person."
          if [ $? -ne 0 ]; then
            echo "record_commit failed -- not pushing an unrecorded commit."
            echo "delivered=no" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git add Team/CHANGELOG.md
          git commit -m "changelog: record ${H}"
          bash Tools/push_with_merge.sh "${BRANCH}"
          if [ $? -ne 0 ]; then
            echo "delivered=no" >> "$GITHUB_OUTPUT"
            echo "THE REPORT DID NOT REACH THE REPOSITORY."
            exit 1
          fi
          echo "delivered=yes" >> "$GITHUB_OUTPUT"

      - name: Verdict
        if: ${{ always() }}
        run: |
          set +e
          if [ "${{ steps.secret.outputs.ok }}" != "yes" ]; then
            echo "NOT MEASURED. A secret is missing; nothing ran."
            exit 1
          fi
          # BRANCH ON THE ROUTE BEFORE COMPARING ANYTHING. On the image
          # route the download and unzip steps never run, so their rc outputs
          # are the EMPTY STRING, and [ "" != "0" ] is true. Before this the
          # first test in the step fired on every image run and called a good
          # run a failed download -- the same bug that was fixed one step away
          # in the report's own verdict text and left standing here.
          if [ "${{ inputs.source }}" = "image" ]; then
            if [ "${{ steps.pull.outputs.rc }}" != "0" ]; then
              echo "pull rc=${{ steps.pull.outputs.rc }} -- see the report."
              echo "rc 70 is a credential, rc 71 is an image with no editor,"
              echo "rc 73/74/75/76/77/78 are the container, the mount and the"
              echo "uid. None of them is 'the engine does not run'."
              exit 1
            fi
          else
            if [ "${{ steps.dl.outputs.rc }}" != "0" ]; then
              echo "download rc=${{ steps.dl.outputs.rc }} -- see the report."
              exit 1
            fi
            if [ "${{ steps.unzip.outputs.rc }}" != "0" ]; then
              echo "unzip rc=${{ steps.unzip.outputs.rc }} -- see the report."
              exit 1
            fi
          fi
          # THE SAME EMPTY-OUTPUT TRAP, THIRD INSTANCE. The `find` step runs
          # ONLY on the zip route, so on the image route its output is the
          # empty string and [ "" != "yes" ] is true. Run 33090067823 built
          # the module, booted the editor and collected FOUR ##TBS## lines,
          # and this line still called it "no UnrealEditor-Cmd in the
          # extracted tree" -- there is no extracted tree on that route at
          # all. The report step at F_FOUND already had the both-routes
          # expression; this is that same expression, and the two now agree.
          if [ "${{ steps.find.outputs.found || (steps.pull.outputs.editor && 'yes') }}" != "yes" ]; then
            echo "no UnrealEditor-Cmd on either route."
            exit 1
          fi
          if [ "${{ steps.deliver.outputs.delivered }}" = "no" ]; then
            echo "measured, but THE REPORT DID NOT REACH THE REPOSITORY."
            exit 1
          fi
          # A SKIPPED BOOT AND A BOOT THAT EXITED NON-ZERO ARE DIFFERENT
          # ANSWERS, and an empty rc is not an exit code. Without the
          # emptiness test this prints "the editor exited ." -- which reads
          # as a failed engine and is really a step that never ran.
          if [ "${{ inputs.boot }}" = "true" ] \
             && [ -z "${{ steps.boot.outputs.rc }}" ]; then
            echo "boot was asked for and the step did not run. NOT MEASURED;"
            echo "that is not the same answer as an editor that failed."
            exit 1
          fi
          if [ "${{ inputs.boot }}" = "true" ] \
             && [ "${{ steps.boot.outputs.rc }}" != "0" ]; then
            echo "engine unpacked, but the editor exited ${{ steps.boot.outputs.rc }}."
            echo "That is a real result and it is in the report."
            exit 1
          fi
          if [ "${{ inputs.boot }}" = "true" ] \
             && [ "${{ steps.boot.outputs.tbs }}" = "0" ]; then
            echo "the editor exited 0 and produced NO ##TBS## line, so"
            echo "nothing here proves Tools/probe_boot.py ran inside it."
            echo "That is a gap in the measurement, not a failed engine."
            exit 1
          fi
          echo "prebuilt engine unpacked and started on a hosted runner,"
          echo "and our own probe ran inside it: ${{ steps.boot.outputs.tbs }} ##TBS## lines."
