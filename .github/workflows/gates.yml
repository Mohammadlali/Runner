# The private project's 25 gates, run on a public repository's runner.
#
# WHY IT IS SAFE TO RUN PRIVATE CODE HERE, and where the edge is:
#   * the private repo is checked out into the job workspace, which is
#     destroyed with the job. Nothing from it is ever committed to THIS repo.
#   * a public repository's job log is world-readable, so the gate output is
#     NOT printed. Tools/run_gates.py writes every gate's full output to a
#     transcript file and prints only "which command, pass or fail". The
#     transcript is pushed to the PRIVATE repo. Any step added here that
#     prints tool output breaks that, so do not add one.
#   * secrets are not given to forks, and workflow_dispatch here requires
#     write access, so TBS_PRIVATE_TOKEN is not reachable from this page.
#
# THIS REPO IS NEVER CHECKED OUT. Only the private one is, into `work/`. Any
# helper a step calls must therefore live in the PRIVATE repo -- run
# 33019109333 failed instantly because it called a script sitting here in
# Runner, which was not on the runner's disk at all.
#
# Every `run:` block is `bash -e`. A failing command kills the step before a
# later line can record its exit code, which is exactly what a gate run must
# not do -- a red gate suite MUST still get its transcript committed. Hence
# `set +e` and an explicit rc, not `set -e` with hope.
#
# Run 1 failed three times over for ONE cause: the secret guard exited 1, so
# checkout never ran, and two later always() steps then reported a missing
# directory and an empty exit code. The guard now sets an OUTPUT instead.
#
# Run 3 was green and STILL left the private repo red: check_changelog does
# not care whether a human or a workflow made a commit, so this job's own
# transcript commit was unrecorded and failed the next run. A commit cannot
# name its own hash, so the transcript is committed first and a follow-up
# `changelog: record <hash>` commit is written by Tools/record_commit.py.
#
# The bare `git push` this file used to end on threw away ten minutes of the
# engine run's measurement (run 33016837041): a session pushed to the branch
# mid-job, the push was rejected, and `set +e` reported the step a success.
# Delivery now goes through Tools/push_with_merge.sh, and a failed delivery
# FAILS the job instead of being reported as 25 gates green.
name: gates

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'push the transcript back to the private repo'
        type: boolean
        default: true

permissions: {}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Is the secret present at all
        id: secret
        env:
          TOK: ${{ secrets.TBS_PRIVATE_TOKEN }}
        run: |
          set +e
          if [ -z "$TOK" ]; then
            echo "ok=no" >> "$GITHUB_OUTPUT"
            echo "TBS_PRIVATE_TOKEN is NOT set on this repository."
          else
            echo "ok=yes" >> "$GITHUB_OUTPUT"
            echo "secret present"
          fi

      - uses: actions/checkout@v4
        if: steps.secret.outputs.ok == 'yes'
        with:
          repository: Mohammadlali/Claud-Cloud-Project
          ref: ${{ vars.TBS_BRANCH || 'claude/gateway-auth-fix-nr7k0b' }}
          token: ${{ secrets.TBS_PRIVATE_TOKEN }}
          fetch-depth: 0          # check_changelog walks the whole history
          path: work

      - name: Run the 25 gates
        id: run
        if: steps.secret.outputs.ok == 'yes'
        working-directory: work
        run: |
          set +e
          echo "machine : $(nproc) cores, $(free -g | awk '/^Mem:/{print $2}') GB ram"
          echo "head    : $(git rev-parse --short HEAD)"
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          OUT="Reports/gates/gates-${TS}.txt"
          mkdir -p Reports/gates
          python3 Tools/run_gates.py --out "$OUT"
          RC=$?
          echo "rc=$RC"   >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "gates exit code : $RC"

      - name: Push the transcript, and record it, to the PRIVATE repo
        id: deliver
        if: ${{ always() && steps.secret.outputs.ok == 'yes' && inputs.commit }}
        working-directory: work
        env:
          OUT:    ${{ steps.run.outputs.out }}
          RC:     ${{ steps.run.outputs.rc }}
          BRANCH: ${{ vars.TBS_BRANCH || 'claude/gateway-auth-fix-nr7k0b' }}
        run: |
          set +e
          if [ ! -f "$OUT" ]; then
            echo "no transcript at '${OUT}' -- the run died before writing one."
            echo "That is a real answer and it is NOT 'the gates passed'."
            echo "delivered=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f Tools/push_with_merge.sh ]; then
            echo "Tools/push_with_merge.sh is missing from the checkout."
            echo "NOT MEASURED as a delivery failure -- the helper is absent."
            echo "delivered=no" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git config user.name  "tbs-runner"
          git config user.email "noreply@github.com"

          git add "$OUT"
          git commit -m "gates: transcript from the public runner, rc=${RC}"
          if [ $? -ne 0 ]; then
            echo "nothing to commit -- stopping before an empty push."
            echo "delivered=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          H=$(git rev-parse --short HEAD)
          echo "transcript commit : $H"

          # A commit cannot name its own hash. The follow-up entry is what
          # keeps check_changelog green on the NEXT run of this workflow.
          python3 Tools/record_commit.py "$H" \
            "the 25-gate transcript from the public runner (\`${OUT}\`), rc=${RC}. Written by \`Runner\` \`gates.yml\`, not by a person. Record only."
          if [ $? -ne 0 ]; then
            echo "record_commit failed -- pushing the transcript anyway would"
            echo "leave the changelog incomplete and the next run red. Stopping."
            echo "delivered=no" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git add Team/CHANGELOG.md
          git commit -m "changelog: record ${H}"

          bash Tools/push_with_merge.sh "${BRANCH}"
          if [ $? -ne 0 ]; then
            echo "delivered=no" >> "$GITHUB_OUTPUT"
            echo "THE TRANSCRIPT DID NOT REACH THE REPOSITORY."
            exit 1
          fi
          echo "delivered=yes" >> "$GITHUB_OUTPUT"

      - name: Verdict
        if: ${{ always() }}
        run: |
          set +e
          if [ "${{ steps.secret.outputs.ok }}" != "yes" ]; then
            echo "NOT MEASURED. The gates did not run, and that is not a pass."
            echo ""
            echo "Add a repository secret named TBS_PRIVATE_TOKEN with access"
            echo "to Mohammadlali/Claud-Cloud-Project, Contents: read+write."
            exit 1
          fi
          RC="${{ steps.run.outputs.rc }}"
          if [ -z "$RC" ]; then
            echo "NOT MEASURED. The gate step produced no exit code."
            exit 1
          fi
          if [ "$RC" != "0" ]; then
            echo "gate suite exit code $RC -- not green."
            exit 1
          fi
          # A green suite whose transcript never arrived is a claim with no
          # evidence behind it, which is the one thing this project does not
          # accept. Say so rather than printing "25 gates green".
          if [ "${{ inputs.commit }}" = "true" ] \
             && [ "${{ steps.deliver.outputs.delivered }}" != "yes" ]; then
            echo "25 gates passed, but THE TRANSCRIPT WAS NOT DELIVERED."
            echo "There is no record of this run in the repository, so it does"
            echo "not count. See this job's log for what the delivery hit."
            exit 1
          fi
          echo "25 gates green, transcript delivered"
